# This workflow proves a data directory created by the latest published
# Owncast release survives an upgrade to the current checkout.
# See test/automated/upgrades/run.sh for the assertions performed.
# Triggers:
#   - Weekly schedule (new releases and new migrations both land between PRs)
#   - Manual dispatch
#   - PRs touching the upgrade suite or this workflow

name: Upgrade Tests

on:
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'test/automated/upgrades/**'
      - '.github/workflows/upgrade-tests.yml'

jobs:
  upgrade-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Authenticates the api.github.com release lookup in run.sh to avoid
      # the anonymous, shared-per-IP rate limit on CI runners.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg sqlite3 jq unzip

      - name: Run upgrade test
        run: ./test/automated/upgrades/run.sh

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-test-logs
          path: test/automated/upgrades/scratch/**/*.log
          if-no-files-found: ignore
