# This workflow tests HLS video streaming functionality
# Triggers:
#   - Push/PR with Go file changes or HLS test changes
# Tests:
#   - Local storage backend
#   - S3 storage backend (when secrets available)
#   - Retries up to 3 times for flaky network tests

name: HLS tests

on:
  push:
    branches:
      - develop
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'test/automated/hls/**'
      - '.github/workflows/hls-tests.yml'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'test/automated/hls/**'
      - '.github/workflows/hls-tests.yml'

env:
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
  S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
  S3_REGION: ${{ secrets.S3_REGION }}
  S3_SECRET: ${{ secrets.S3_SECRET }}
  # Authenticates github.com downloads in tools.sh (ffmpeg) to avoid the
  # anonymous, shared-per-IP rate limit on CI runners.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Detect relevant changes in a standalone job so the test job can be gated
  # at the job level: a run with no relevant changes reports as "skipped"
  # instead of a misleading "success".
  changes:
    runs-on: ubuntu-latest
    outputs:
      src_any_changed: ${{ steps.changed-files-yaml.outputs.src_any_changed }}
    steps:
      - name: Check out pull request code
        uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fetch base branch for comparison
        if: github.event_name == 'pull_request'
        run: |
          git remote add upstream https://github.com/${{ github.event.pull_request.base.repo.full_name }}.git || true
          git fetch upstream ${{ github.event.pull_request.base.ref }}

      - name: Check out repository code
        uses: actions/checkout@v7
        if: github.event_name == 'push'

      - name: Get changed files
        id: changed-files-yaml
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            src:
              - '**/*.{go,mod,sum}'

  tests:
    needs: changes
    if: needs.changes.outputs.src_any_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'

      - name: Check out pull request code
        uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check out repository code
        uses: actions/checkout@v7
        if: github.event_name == 'push'

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true

      - name: Cache node modules
        uses: actions/cache@v6
        env:
          cache-name: cache-node-modules-hls-tests
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('test/automated/hls/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Local stroage
        id: local-storage
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: cd test/automated/hls && ./run.sh

      - name: S3 storage
        id: s3-storage
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: cd test/automated/hls && ./run-s3.sh

      # Passing only after a retry is a flake, not a pass: make it visible.
      - name: Report flaky retries
        if: steps.local-storage.outputs.total_attempts > 1 || steps.s3-storage.outputs.total_attempts > 1
        env:
          LOCAL_ATTEMPTS: ${{ steps.local-storage.outputs.total_attempts }}
          S3_ATTEMPTS: ${{ steps.s3-storage.outputs.total_attempts }}
        run: |
          report() {
            echo "::warning title=Flaky test suite::$1"
            echo ":warning: $1" >> "$GITHUB_STEP_SUMMARY"
          }
          if [ "${LOCAL_ATTEMPTS:-1}" -gt 1 ]; then
            report "HLS local storage tests passed only on attempt $LOCAL_ATTEMPTS"
          fi
          if [ "${S3_ATTEMPTS:-1}" -gt 1 ]; then
            report "HLS S3 storage tests passed only on attempt $S3_ATTEMPTS"
          fi
