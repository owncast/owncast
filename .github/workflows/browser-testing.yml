# This workflow runs browser-based tests using Cypress
# Triggers:
#   - Push/PR with web, Go backend, or browser test changes
# Note: Browser tests require both frontend and backend

name: Browser Tests

on:
  push:
    branches:
      - develop
    paths:
      - 'web/**'
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'test/automated/browser/**'
      - '.github/workflows/browser-testing.yml'
  pull_request:
    paths:
      - 'web/**'
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'test/automated/browser/**'
      - '.github/workflows/browser-testing.yml'

jobs:
  # Detect relevant changes in a standalone job so the test job can be gated
  # at the job level: a run with no relevant changes reports as "skipped"
  # instead of a misleading "success".
  changes:
    runs-on: ubuntu-latest
    outputs:
      testable_any_changed: ${{ steps.changed-files-yaml.outputs.testable_any_changed }}
    steps:
      - name: Check out pull request code
        uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fetch base branch for comparison
        if: github.event_name == 'pull_request'
        run: |
          git remote add upstream https://github.com/${{ github.event.pull_request.base.repo.full_name }}.git || true
          git fetch upstream ${{ github.event.pull_request.base.ref }}

      - name: Check out repository code
        uses: actions/checkout@v7
        if: github.event_name == 'push'

      - name: Get changed files
        id: changed-files-yaml
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            testable:
              - 'web/**/*.{tsx,ts,jsx,js,css,scss}'
              - 'test/automated/browser/**'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            docs:
              - '**/*.md'

  cypress-run:
    needs: changes
    if: needs.changes.outputs.testable_any_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The video comment step below creates/updates a PR comment.
      pull-requests: write
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'

      - name: Check out pull request code
        uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check out repository code
        uses: actions/checkout@v7
        if: github.event_name == 'push'

      - uses: actions/setup-node@v7
        with:
          node-version: '24.12.0'

      - name: Cache node modules
        uses: actions/cache@v6
        env:
          cache-name: cache-node-modules-browser-tests
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('test/automated/browser/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true

      - name: Install Google Chrome
        run: sudo apt-get update && sudo apt-get install -y google-chrome-stable

      - name: Run Browser tests
        id: tests
        uses: nick-fields/retry@v4
        env:
          # Authenticates github.com downloads in tools.sh (ffmpeg) to avoid
          # the anonymous, shared-per-IP rate limit on CI runners.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Record videos of every spec via cypress's native env override
          # (CI-only; local runs stay fast).
          CYPRESS_VIDEO: 'true'
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: cd test/automated/browser && ./run.sh

      # Passing only after a retry is a flake, not a pass: make it visible.
      # Two layers: whole-suite retries (total_attempts above) and per-test
      # Cypress retries, which exit 0 and are recorded by cypress.config.js
      # into cypress/results/flaky.json.
      - name: Report flaky retries
        env:
          ATTEMPTS: ${{ steps.tests.outputs.total_attempts }}
          FLAKY: test/automated/browser/cypress/results/flaky.json
        run: |
          report() {
            echo "::warning title=Flaky test suite::$1"
            echo ":warning: $1" >> "$GITHUB_STEP_SUMMARY"
          }
          if [ "${ATTEMPTS:-1}" -gt 1 ]; then
            report "Browser tests passed only on attempt $ATTEMPTS"
          fi
          if [ -s "$FLAKY" ]; then
            report "$(jq length "$FLAKY") browser test(s) passed only on a Cypress retry"
            {
              echo '```json'
              cat "$FLAKY"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Preserve test evidence (server logs/DBs, coverage, machine-readable
      # results, Cypress failure details and screenshots) even when a failed
      # test step halts the job.
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-evidence
          if-no-files-found: ignore
          path: |
            test/automated/*/test-artifacts/**
            test/automated/*/e2e-coverage/**
            test/automated/*/results/*.json
            test/automated/browser/cypress/results/**
            test/automated/browser/cypress/screenshots/**

      # Videos are a separate artifact from the evidence bundle: they are
      # much larger, so they get a shorter retention, and the PR comment
      # below links this artifact directly.
      - name: Upload UI test videos
        id: video-upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-videos
          if-no-files-found: ignore
          retention-days: 14
          path: test/automated/browser/cypress/videos/**

      # Publish recordings as standalone, browser-playable URLs. The repo's
      # S3 storage (already used by the HLS S3 tests) serves the mp4s
      # directly, so reviewers click a link instead of downloading a zip.
      # Only recordings that say something about this PR are published: a
      # spec that failed, one that passed only on a retry, or one the PR
      # added or changed. The rest stay in the artifact above.
      # Per-PR prefix is wiped first, so a PR only ever holds its latest
      # run's videos. Fork PRs have no secrets and skip this.
      - name: Publish videos for in-browser viewing
        id: video-publish
        continue-on-error: true
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.video-upload.outputs.artifact-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET: ${{ secrets.S3_SECRET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$S3_BUCKET" ] || [ -z "$S3_ENDPOINT" ]; then
            echo "No S3 storage configured; skipping browser-viewable video links."
            exit 0
          fi
          cd test/automated/browser/cypress
          if [ ! -d videos ]; then
            echo "No videos recorded; nothing to publish."
            exit 0
          fi
          export AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$S3_SECRET"
          export AWS_DEFAULT_REGION="${S3_REGION:-us-east-1}"
          PREFIX="ci/browser-test-videos/pr-$PR_NUMBER"
          mkdir -p results
          # tools.sh downloads its static ffmpeg into the calling suite's
          # directory ($(pwd) at install time), so the browser suite's copy
          # lives one level up from this cypress directory. Check the other
          # plausible locations too, and say so loudly when none exists --
          # a silent skip ships stream-broken videos.
          FFMPEG=""
          for candidate in ../ffmpeg ../../ffmpeg ffmpeg; do
            if command -v "$candidate" >/dev/null; then FFMPEG="$candidate"; break; fi
          done
          if [ -z "$FFMPEG" ]; then
            echo "::warning title=Video publish::ffmpeg not found; publishing videos without the faststart remux (streaming playback may misbehave)"
          fi
          # reasons.tsv: group, spec file name, why the recording is relevant.
          # Retried ledgers are from earlier attempts of the whole suite
          # (run.sh keeps them). A changed spec carries its e2e folder
          # instead of a group, so it matches every viewport run of that
          # folder (desktop-offline, mobile-offline) and no other folder.
          # shellcheck disable=SC2016  # $why is a jq variable, not a shell one
          spec_reason='.[] | [.group, (.spec | split("/") | last), $why] | @tsv'
          {
            if [ -f results/failures.json ]; then
              jq -r --arg why failed "$spec_reason" results/failures.json
            fi
            # An earlier attempt's failure is not proof of a later pass: a
            # retry can die before it reaches that group again.
            for ledger in results/failures-retried-*.json; do
              if [ -f "$ledger" ]; then
                jq -r --arg why 'failed on an earlier attempt' "$spec_reason" "$ledger"
              fi
            done
            for ledger in results/flaky.json results/flaky-retried-*.json; do
              if [ -f "$ledger" ]; then
                jq -r --arg why 'passed on retry' "$spec_reason" "$ledger"
              fi
            done
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '
              .[] | select(.status != "removed") | .filename
              | select(startswith("test/automated/browser/cypress/e2e/"))
              | split("/") | [.[-2], .[-1], "changed in this PR"] | @tsv'
          } > results/reasons.tsv
          # Wipe the PR's previous recordings only now that selection worked,
          # so a failed lookup above leaves an earlier comment's links alive.
          aws s3 rm "s3://$S3_BUCKET/$PREFIX" --recursive --endpoint-url "$S3_ENDPOINT" --quiet || true
          group=""
          find videos -name '*.mp4' | sort | while read -r f; do
            dir="${f#videos/}"; dir="${dir%%/*}"
            name="$(basename "$f" .mp4)"
            reason=$(awk -F'\t' -v g="$dir" -v d="${dir#*-}" -v s="$name" '
              ($1 == g || $1 == d) && $2 == s { r[$3] = 1 }
              END {
                if (r["failed"]) out = "failed"
                else if (r["failed on an earlier attempt"]) out = "failed on an earlier attempt"
                else if (r["passed on retry"]) out = "passed on retry"
                if (r["changed in this PR"]) out = out (out ? ", " : "") "changed in this PR"
                print out
              }' results/reasons.tsv)
            if [ -z "$reason" ]; then continue; fi
            # Cypress writes the mp4 index (moov atom) at the end of the
            # file, so browsers streaming from a URL stop early or report a
            # wrong duration. Remux (stream copy) to move it to the front.
            # The temp name must keep the .mp4 suffix: ffmpeg infers the
            # muxer from the extension and rejects anything else.
            if [ -n "$FFMPEG" ]; then
              "$FFMPEG" -v error -y -i "$f" -c copy -movflags +faststart "${f%.mp4}.fast.mp4" &&
                mv "${f%.mp4}.fast.mp4" "$f"
            fi
            key="$PREFIX/${f#videos/}"
            url="$S3_ENDPOINT/$S3_BUCKET/$key"
            aws s3 cp "$f" "s3://$S3_BUCKET/$key" --endpoint-url "$S3_ENDPOINT" \
              --acl public-read --content-type video/mp4 --no-progress >&2
            poster_url=""
            # Cypress captures a preview from the last tested page before it tears
            # down the browser. Do not extract a frame from a video tail: that can
            # be blank, and specs without selected tests have no preview to publish.
            preview="screenshots/$dir/$name/preview.png"
            if [ -f "$preview" ]; then
              preview_key="$PREFIX/${preview#screenshots/}"
              poster_url="$S3_ENDPOINT/$S3_BUCKET/$preview_key"
              aws s3 cp "$preview" "s3://$S3_BUCKET/$preview_key" --endpoint-url "$S3_ENDPOINT" \
                --acl public-read --content-type image/png --no-progress >&2
            fi
            # Group recordings under the same heading as their explicit preview.
            if [ "$dir" != "$group" ]; then
              group="$dir"
              printf '\n**%s**\n\n' "$group"
            fi
            if [ -n "$poster_url" ]; then
              printf -- '- [%s](%s) (%s) [![%s preview](%s)](%s)\n' "$name" "$url" "$reason" "$name" "$poster_url" "$url"
            else
              printf -- '- [%s](%s) (%s)\n' "$name" "$url" "$reason"
            fi
          done > results/video-links.md
          echo "Published $(grep -c '^- ' results/video-links.md) videos."

      # Keep one sticky comment on the PR with a click-to-watch link per
      # relevant recording (created once, updated in place). A run with
      # nothing relevant posts no comment, and rewrites an earlier one so it
      # does not keep showing a previous commit's recordings. The publish
      # step wipes the old recordings before uploading, so this still runs
      # when an upload failed partway: an earlier comment's links are dead
      # by then and have to be replaced. Same-repo PRs only: fork PRs run
      # with a read-only token that cannot comment.
      - name: Link UI test videos on the PR
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.video-upload.outputs.artifact-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_URL: ${{ steps.video-upload.outputs.artifact-url }}
          LINKS_FILE: test/automated/browser/cypress/results/video-links.md
          PUBLISH_OUTCOME: ${{ steps.video-publish.outcome }}
        run: |
          MARKER='<!-- e2e-ui-test-videos -->'
          # The publish step creates the links file, empty or not, right
          # after it wipes the old recordings. Without the file nothing was
          # wiped or selected, so leave any earlier comment alone.
          if [ ! -e "$LINKS_FILE" ]; then
            echo "Recordings were not published; skipping comment."
            exit 0
          fi
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$MARKER\")) | .id][0] // empty")
          if [ ! -s "$LINKS_FILE" ] && [ -z "$existing" ]; then
            echo "No recordings to link and no existing comment; nothing to do."
            exit 0
          fi
          {
            echo "$MARKER"
            echo "## E2E UI test videos"
            echo
            if [ -s "$LINKS_FILE" ]; then
              echo "Recordings of specs that failed, needed a retry, or changed in this PR (commit $HEAD_SHA). Click one to watch it in your browser. Each recording is of the spec's most recent run."
              cat "$LINKS_FILE"
            elif [ "$PUBLISH_OUTCOME" = success ]; then
              echo "No recordings of failed, retried, or changed specs to show for commit $HEAD_SHA."
            fi
            if [ "$PUBLISH_OUTCOME" != success ]; then
              echo
              echo "Publishing the recordings for commit $HEAD_SHA did not finish, so some may be missing here."
            fi
            echo
            echo "All recordings as a downloadable artifact (14-day retention): [browser-test-videos]($ARTIFACT_URL)"
          } > /tmp/video-comment.md
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@/tmp/video-comment.md >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@/tmp/video-comment.md >/dev/null
          fi
