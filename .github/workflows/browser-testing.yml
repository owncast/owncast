# This workflow runs browser-based tests using Cypress
# Triggers:
#   - Push/PR with web, Go backend, or browser test changes
# Note: Browser tests require both frontend and backend

name: Browser Tests

on:
  push:
    branches:
      - develop
    paths:
      - 'web/**'
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'test/automated/browser/**'
      - '.github/workflows/browser-testing.yml'
  pull_request:
    paths:
      - 'web/**'
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'test/automated/browser/**'
      - '.github/workflows/browser-testing.yml'

jobs:
  # Detect relevant changes in a standalone job so the test job can be gated
  # at the job level: a run with no relevant changes reports as "skipped"
  # instead of a misleading "success".
  changes:
    runs-on: ubuntu-latest
    outputs:
      testable_any_changed: ${{ steps.changed-files-yaml.outputs.testable_any_changed }}
    steps:
      - name: Check out pull request code
        uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fetch base branch for comparison
        if: github.event_name == 'pull_request'
        run: |
          git remote add upstream https://github.com/${{ github.event.pull_request.base.repo.full_name }}.git || true
          git fetch upstream ${{ github.event.pull_request.base.ref }}

      - name: Check out repository code
        uses: actions/checkout@v7
        if: github.event_name == 'push'

      - name: Get changed files
        id: changed-files-yaml
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            testable:
              - 'web/**/*.{tsx,ts,jsx,js,css,scss}'
              - 'test/automated/browser/**'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            docs:
              - '**/*.md'

  cypress-run:
    needs: changes
    if: needs.changes.outputs.testable_any_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The video comment step below creates/updates a PR comment.
      pull-requests: write
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'

      - name: Check out pull request code
        uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check out repository code
        uses: actions/checkout@v7
        if: github.event_name == 'push'

      - uses: actions/setup-node@v6
        with:
          node-version: '24.12.0'

      - name: Cache node modules
        uses: actions/cache@v6
        env:
          cache-name: cache-node-modules-browser-tests
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('test/automated/browser/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true

      - name: Install Google Chrome
        run: sudo apt-get update && sudo apt-get install google-chrome-stable

      - name: Run Browser tests
        id: tests
        uses: nick-fields/retry@v4
        env:
          # Authenticates github.com downloads in tools.sh (ffmpeg) to avoid
          # the anonymous, shared-per-IP rate limit on CI runners.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Record videos of every spec via cypress's native env override
          # (CI-only; local runs stay fast).
          CYPRESS_VIDEO: 'true'
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: cd test/automated/browser && ./run.sh

      # Passing only after a retry is a flake, not a pass: make it visible.
      # Two layers: whole-suite retries (total_attempts above) and per-test
      # Cypress retries, which exit 0 and are recorded by cypress.config.js
      # into cypress/results/flaky.json.
      - name: Report flaky retries
        env:
          ATTEMPTS: ${{ steps.tests.outputs.total_attempts }}
          FLAKY: test/automated/browser/cypress/results/flaky.json
        run: |
          report() {
            echo "::warning title=Flaky test suite::$1"
            echo ":warning: $1" >> "$GITHUB_STEP_SUMMARY"
          }
          if [ "${ATTEMPTS:-1}" -gt 1 ]; then
            report "Browser tests passed only on attempt $ATTEMPTS"
          fi
          if [ -s "$FLAKY" ]; then
            report "$(jq length "$FLAKY") browser test(s) passed only on a Cypress retry"
            {
              echo '```json'
              cat "$FLAKY"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Preserve test evidence (server logs/DBs, coverage, machine-readable
      # results, Cypress failure details and screenshots) even when a failed
      # test step halts the job.
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          if-no-files-found: ignore
          path: |
            test/automated/*/test-artifacts/**
            test/automated/*/e2e-coverage/**
            test/automated/*/results/*.json
            test/automated/browser/cypress/results/**
            test/automated/browser/cypress/screenshots/**

      # Videos are a separate artifact from the evidence bundle: they are
      # much larger, so they get a shorter retention, and the PR comment
      # below links this artifact directly.
      - name: Upload UI test videos
        id: video-upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-videos
          if-no-files-found: ignore
          retention-days: 14
          path: test/automated/browser/cypress/videos/**

      # Keep one sticky comment on the PR pointing at the latest desktop and
      # mobile UI test recordings. Same-repo PRs only: fork PRs run with a
      # read-only token that cannot comment.
      - name: Link UI test videos on the PR
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.video-upload.outputs.artifact-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_URL: ${{ steps.video-upload.outputs.artifact-url }}
        run: |
          MARKER='<!-- e2e-ui-test-videos -->'
          BODY="$(printf '%s\n## E2E UI test videos\n\nDesktop and mobile Cypress recordings for %s: [download the videos artifact](%s) (14-day retention).\n\nRecorded runs with per-test playback: [Cypress Cloud](https://cloud.cypress.io/projects/wwi3xe/runs)\n' "$MARKER" "$HEAD_SHA" "$ARTIFACT_URL")"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$MARKER\")) | .id][0] // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$BODY" >/dev/null
          fi
