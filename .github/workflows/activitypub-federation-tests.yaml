name: ActivityPub Federation Tests

on:
  push:
    paths:
      - "activitypub/**"
      - "webserver/**"
      - "test/automated/activitypub/**"
      - ".github/workflows/activitypub-federation-tests.yaml"
  pull_request:
    paths:
      - "activitypub/**"
      - "webserver/**"
      - "test/automated/activitypub/**"
      - ".github/workflows/activitypub-federation-tests.yaml"

jobs:
  federation-test:
    runs-on: ubuntu-latest

    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: "same_content_newer"

      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "^1.23"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y snac2 ffmpeg

      - name: Run setup
        run: |
          cd test/automated/activitypub
          sudo ./setup.sh

      - name: Run federation test
        run: |
          cd test/automated/activitypub
          CI=true USER_COUNT=20 ./run.sh
