name: ActivityPub Tests

on:
  push:
    branches:
      - develop
    paths:
      - "services/activitypub/**"
      - "services/chat/**"
      - "config/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - "webserver/**"
      - "auth/**"
      - "persistence/**"
      - "test/automated/activitypub/**"
      - ".github/workflows/activitypub-tests.yaml"
  pull_request:
    paths:
      - "services/activitypub/**"
      - "services/chat/**"
      - "config/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - "webserver/**"
      - "auth/**"
      - "persistence/**"
      - "test/automated/activitypub/**"
      - ".github/workflows/activitypub-tests.yaml"

jobs:
  federation-test:
    runs-on: ubuntu-latest
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: "same_content_newer"

      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true

      - name: Install Caddy
        run: |
          CADDY_URL=$(curl -sf https://api.github.com/repos/caddyserver/caddy/releases/latest \
            | grep -o 'https://github.com/caddyserver/caddy/releases/download/[^"]*linux_amd64\.tar\.gz' \
            | head -1)
          curl -sfL "$CADDY_URL" -o caddy.tar.gz
          tar -xzf caddy.tar.gz caddy
          sudo mv caddy /usr/local/bin/caddy

      - name: Install dependencies
        run: |
          sudo apt-get install -y snac2 ffmpeg

      - name: Run setup
        env:
          # Authenticates the mkcert download in setup.sh against github.com
          # to avoid the anonymous, shared-per-IP rate limit on CI runners.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd test/automated/activitypub
          # Preserve GITHUB_TOKEN across sudo (sudo strips env by default) so
          # setup.sh's github.com downloads use it.
          sudo --preserve-env=GITHUB_TOKEN ./setup.sh

      - name: Run federation test
        run: |
          cd test/automated/activitypub
          CI=true USER_COUNT=20 ./test-federation.sh

  chat-sanitization-test:
