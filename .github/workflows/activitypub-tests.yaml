      - name: Run setup
        env:
          # Authenticates the mkcert download in setup.sh against github.com
          # to avoid the anonymous, shared-per-IP rate limit on CI runners.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd test/automated/activitypub
          # Preserve GITHUB_TOKEN across sudo (sudo strips env by default) so
          # setup.sh's github.com downloads use it.
          sudo --preserve-env=GITHUB_TOKEN ./setup.sh

      - name: Run chat sanitization test
        run: |
          cd test/automated/activitypub
          CI=true ./test-chat-sanitization.sh

  follower-validation-test:
    runs-on: ubuntu-latest
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: "same_content_newer"

      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 ffmpeg jq

      - name: Run follower validation test
        timeout-minutes: 15
        run: |
          cd test/automated/activitypub
          ./test-follower-validation.sh

