# Runs the standalone plugin end-to-end integration tests: builds a plugin
# from the Owncast plugin SDK, loads it into a real Owncast instance, and
# verifies it filters chat. Mirrors the API test workflow.

name: Automated plugin tests

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'web/**'
  pull_request:
    paths-ignore:
      - 'web/**'

jobs:
  # Detect relevant changes in a standalone job so the test job can be gated
  # at the job level: a run with no relevant changes reports as "skipped"
  # instead of a misleading "success".
  changes:
    runs-on: ubuntu-latest
    outputs:
      src_any_changed: ${{ steps.changed-files-yaml.outputs.src_any_changed }}
    steps:
      - name: Check out pull request code
        uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fetch base branch for comparison
        if: github.event_name == 'pull_request'
        run: |
          git remote add upstream https://github.com/${{ github.event.pull_request.base.repo.full_name }}.git || true
          git fetch upstream ${{ github.event.pull_request.base.ref }}

      - name: Check out repository code
        uses: actions/checkout@v7
        if: github.event_name == 'push'

      - name: Get changed files
        id: changed-files-yaml
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            src:
              - '**/*.{go,mod,sum}'
              - 'test/automated/plugins/**'

  test:
    needs: changes
    if: needs.changes.outputs.src_any_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'

      - name: Check out pull request code
        uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check out repository code
        uses: actions/checkout@v7
        if: github.event_name == 'push'

      - uses: earthly/actions-setup@v1
        with:
          version: 'latest'
          # Authenticate the action's GitHub API calls (release lookup +
          # binary download). Without a token these are anonymous and share
          # the runner IP's 60-requests/hour limit, which routinely trips
          # "API rate limit exceeded". The token raises this to 5,000/hour.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Earthly version
        run: earthly --version

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Run plugin tests
        id: tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: earthly +plugin-tests

      # Passing only after a retry is a flake, not a pass: make it visible.
      - name: Report flaky retries
        if: steps.tests.outputs.total_attempts > 1
        run: |
          MSG="Plugin tests passed only on attempt ${{ steps.tests.outputs.total_attempts }}"
          echo "::warning title=Flaky test suite::$MSG"
          echo ":warning: $MSG" >> "$GITHUB_STEP_SUMMARY"

      # Preserve test evidence (server logs/DBs, coverage, machine-readable
      # results) even when a failed test step halts the job.
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-test-evidence
          if-no-files-found: ignore
          path: |
            test/automated/*/test-artifacts/**
            test/automated/*/e2e-coverage/**
            test/automated/*/results/*.json
